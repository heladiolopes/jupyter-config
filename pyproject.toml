[project]
name = "local-jupyterlab"
version = "0.1.0"
description = "A reusable local JupyterLab environment with project kernels"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.4,<5",
    "jupyterlab-code-formatter>=3.1.0",
    "jupyterlab-git>=0.55.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "jupyterlab-widgets>=3,<4",
    "ruff>=0.17.2",
]

[tool.uv]
package = false
